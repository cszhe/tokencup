# TokenCup configuration template.
# Copy to config.toml and fill in your real credentials:
#   cp config.example.toml config.toml
# config.toml is git-ignored.

[database]
host = "localhost"
port = 3306
user = "tokencup"
password = "changeme"
database = "tokencup"

[server]
# Loopback only. The API has no auth by design -- the judge is the sole trusted
# client -- so POST /games/{id}/moves, /resign and /adjudicate are writable by
# anyone who can reach this port. Do not bind 0.0.0.0 on a shared network; use
# an SSH tunnel to watch from another machine.
host = "127.0.0.1"
port = 8000
